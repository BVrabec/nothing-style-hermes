# Nothing Neu White — Neumorphism × Nothing for the Hermes dashboard.
# GENERATED by tools/build-themes.py — edit that file, not this one.
#
# Destination on the host:  ~/.hermes/dashboard-themes/nothing-neu-light.yaml
# Pair: nothing-neu (dark) and nothing-neu-light (white); the nothing-hud
# plugin's Dark/White switch at the bottom of the sidebar flips between them.
# Every key is documented in SCHEMA/THEME-REFERENCE.md.

name: nothing-neu-light
label: Nothing Neu White
description: Neumorphism × Nothing, soft white

palette:
  background: "#E7E8EC"
  midground: "#1B1C20"
  foreground:
    hex: "#FFFFFF"
    alpha: 0.0
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  # Space Grotesk for reading, Space Mono for labels and data, Doto for the
  # one dot-matrix moment per screen (placed by the nothing-hud plugin).
  fontSans: '"Space Grotesk", system-ui, sans-serif'
  fontMono: '"Space Mono", ui-monospace, monospace'
  fontDisplay: '"Space Grotesk", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Doto:wght@700&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap"
  baseSize: '14px;}html[style*="#041c1c" i] #root{opacity:0;animation:nh-fp 0s 3s forwards}html[style*="#041c1c" i],html[style*="#041c1c" i] body{background-color:#E7E8EC!important}@keyframes nh-fp{to{opacity:1}}:root{--theme-base-size:14px!important}:root{--nh-fp:1'
  lineHeight: "1.55"
  letterSpacing: "0"

layout:
  radius: "1rem"                     # soft, rounded surfaces
  density: comfortable

layoutVariant: standard

assets:
  # Markers for the nothing-hud plugin, not artwork: nothingHud = draw the
  # slot pieces; nothingNeu = draw them in the neumorphic style. Documented
  # form: pre-wrapped gradient expressions are used as-is.
  custom:
    nothingHud: "linear-gradient(#E7E8EC, #E7E8EC)"
    nothingNeu: "linear-gradient(#E7E8EC, #E7E8EC)"

componentStyles:
  # Only properties the shell reads (card: background/boxShadow; header and
  # sidebar: background).
  card:
    background: "#E7E8EC"
    boxShadow: "-4px -4px 9px rgba(255, 255, 255, 0.95), 4px 4px 10px rgba(163, 167, 181, 0.55)"
  header:
    background: "transparent"
  sidebar:
    background: "#E7E8EC"

colorOverrides:
  card: "#E7E8EC"
  cardForeground: "#1B1C20"
  popover: "#ECEDF1"
  popoverForeground: "#1B1C20"
  primary: "#7A5CFA"
  primaryForeground: "#FFFFFF"
  secondary: "#DFE0E5"
  secondaryForeground: "#1B1C20"
  muted: "#DFE0E5"
  mutedForeground: "#5E6170"
  accent: "#ECEDF1"
  accentForeground: "#1B1C20"
  destructive: "#D71921"
  destructiveForeground: "#FFFFFF"
  success: "#1FA67A"
  warning: "#C98A12"
  border: "rgba(27, 28, 32, 0.07)"
  input: "rgba(27, 28, 32, 0.07)"
  ring: "#7A5CFA"

customCSS: |
  /* Neumorphism × Nothing — generated by tools/build-themes.py, do not edit.
     Hooks used: #app-sidebar, <header>/<main>, aria-current, ARIA roles, and
     Tailwind utility classes of the Hermes dashboard (checked on 0.19/0.21.5). */

  :root {
    --neu-mode: light;
    --neu-base: #E7E8EC; --neu-well: #DFE0E5; --neu-fg: #1B1C20; --neu-fg2: #5E6170; --neu-fg3: #9A9DA9;
    --neu-hi: rgba(255, 255, 255, 0.95); --neu-lo: rgba(163, 167, 181, 0.55); --neu-line: rgba(27, 28, 32, 0.07);
    --neu-violet: #7A5CFA; --neu-mint: #1FA67A; --neu-amber: #C98A12; --neu-sky: #2F7FD8; --neu-red: #D71921;
    --neu-raised: -7px -7px 16px var(--neu-hi), 8px 8px 18px var(--neu-lo);
    --neu-raised-sm: -4px -4px 9px var(--neu-hi), 4px 4px 10px var(--neu-lo);
    --neu-pressed: inset 4px 4px 9px var(--neu-lo), inset -4px -4px 9px var(--neu-hi);
    --text-secondary: #5E6170;
    --font-sans: var(--theme-font-sans);
    --font-mondwest: var(--theme-font-mono);
    --font-rules-compressed: var(--theme-font-mono);
    --font-rules-expanded: var(--theme-font-sans);
  }
  body, #root { background: var(--neu-base) !important; }
  .font-courier, .font-mondwest, .font-compressed { font-family: var(--theme-font-mono) !important; }
  .font-expanded { font-family: var(--theme-font-sans) !important; }
  .font-compressed { letter-spacing: 0.04em !important; }
  .font-bold, .font-semibold, h1, h2, h3, strong, b { font-weight: 500 !important; }
  ::selection { background: var(--neu-violet); color: #FFFFFF; }
  * { scrollbar-width: thin; scrollbar-color: var(--neu-fg3) transparent; }

  /* ---- the floating rail ------------------------------------------------ */
  @media (min-width: 1024px) {
    #app-sidebar {
      margin: 20px 0 20px 20px;
      height: calc(100dvh - 40px) !important; max-height: calc(100dvh - 40px) !important;
      border: 0 !important; border-radius: 22px;
      background: var(--neu-base) !important;
      box-shadow: var(--neu-raised);
      overflow: hidden;
    }
  }
  #app-sidebar, #app-sidebar * { border-color: transparent !important; }
  #app-sidebar nav { padding: 8px 12px !important; }
  #app-sidebar nav a {
    margin: 3px 0; padding: 10px 14px !important; border-radius: 14px;
    text-transform: none !important; letter-spacing: 0 !important; font-size: 13.5px !important;
    color: var(--neu-fg2) !important; box-shadow: none !important; background-color: transparent !important;
  }
  /* the concept's rail: a small dot instead of an icon; violet when active */
  #app-sidebar nav a svg { display: none !important; }
  #app-sidebar nav a {
    background-image: radial-gradient(circle, var(--neu-fg3) 3px, transparent 3.6px) !important;
    background-repeat: no-repeat !important; background-size: 8px 8px !important; background-position: 16px 50% !important;
    padding-left: 36px !important;
  }
  #app-sidebar nav a[aria-current="page"] {
    background-image: radial-gradient(circle, var(--neu-violet) 3px, transparent 3.6px) !important;
  }
  #app-sidebar nav a:hover { color: var(--neu-fg) !important; box-shadow: var(--neu-raised-sm) !important; }
  #app-sidebar nav a[aria-current="page"] {
    color: var(--neu-fg) !important; background-color: var(--neu-well) !important; box-shadow: var(--neu-pressed) !important;
  }
  #app-sidebar nav a > span[aria-hidden="true"] { display: none !important; }
  #app-sidebar [class*="text-text-tertiary"] { font-family: var(--theme-font-mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; color: var(--neu-fg3) !important; }

  /* ---- top bar ------------------------------------------------------------ */
  header { background: transparent !important; border: 0 !important; box-shadow: none !important; }
  header h1 { font-family: var(--theme-font-sans) !important; font-size: 24px !important; font-weight: 400 !important;
    letter-spacing: -0.01em !important; text-transform: none !important; color: var(--neu-fg) !important; overflow: visible; }
  @media (min-width: 640px) { header { height: 72px !important; min-height: 72px !important; padding-top: 12px; } }
  @media (max-width: 1023px) {
    header.fixed { background: var(--neu-base) !important; box-shadow: 0 6px 16px var(--neu-lo) !important; }
  }

  /* ---- surfaces: raised cards, pressed wells -------------------------------- */
  main [class*="border-midground/15"], main [class*="border-current/20"], main [class*="border-midground/20"],
  main [data-slot="card"], main [class~="border"][class~="border-border"] {
    border-color: transparent !important; border-radius: 18px !important;
    background: var(--neu-base) !important; box-shadow: var(--neu-raised-sm) !important;
  }
  main [class*="border-midground/15"] [class*="border-midground/15"],
  main [class*="border-current/20"] [class*="border-midground/15"] { box-shadow: var(--neu-pressed) !important; background: var(--neu-well) !important; }
  main [class*="border-b"], main [class*="border-t"] { border-color: var(--neu-line) !important; }
  input, textarea, select, [role="combobox"],
  main button[class*="h-9"][class*="border"] {
    background: var(--neu-well) !important; border: 0 !important; border-radius: 12px !important;
    box-shadow: var(--neu-pressed) !important; color: var(--neu-fg) !important;
  }
  ::placeholder { color: var(--neu-fg3) !important; opacity: 1; }

  /* buttons: soft pills; the filled one is violet */
  main button[class*="border"]:not([class*="h-9"]), main a[class*="border"] {
    border-color: transparent !important; border-radius: 12px !important; box-shadow: var(--neu-raised-sm) !important;
  }
  main button[class*="border"]:active { box-shadow: var(--neu-pressed) !important; }
  [class~="bg-midground"], [class~="bg-foreground"], [class~="bg-primary"],
  [class~="bg-foreground/90"], [class~="bg-foreground/80"], [class~="bg-midground/90"], [class~="bg-midground/80"] { background: var(--neu-violet) !important; color: #FFFFFF !important; border-radius: 12px; }
  [class*="shadow-[inset"] { box-shadow: var(--neu-raised-sm) !important; }
  .shadow-xs, .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl { box-shadow: var(--neu-raised-sm) !important; }

  /* segmented groups (tabs, filters) sit in a well; the chosen one rises */
  main [class*="inline-flex"][class*="border"] { background: var(--neu-well) !important; box-shadow: var(--neu-pressed) !important; border-radius: 14px !important; padding: 4px; gap: 4px; }
  main [class*="inline-flex"][class*="border"] > button { border: 0 !important; border-radius: 10px !important; box-shadow: none !important; }
  main [class*="inline-flex"][class*="border"] > button[class*="bg-midground"],
  main [class*="inline-flex"][class*="border"] > button[aria-selected="true"],
  main [class*="inline-flex"][class*="border"] > button[data-state="active"] {
    background: var(--neu-base) !important; color: var(--neu-fg) !important; box-shadow: var(--neu-raised-sm) !important;
  }

  /* toggles: a soft track; ON glows mint */
  [role="switch"] { border: 0 !important; border-radius: 999px !important; background: var(--neu-well) !important; box-shadow: var(--neu-pressed) !important; }
  [role="switch"] > span { border-radius: 999px !important; background: var(--neu-base) !important; box-shadow: var(--neu-raised-sm) !important; }
  [role="switch"][aria-checked="true"] > span, [role="switch"][data-state="checked"] > span { background: var(--neu-mint) !important; box-shadow: 0 0 10px var(--neu-mint) !important; }

  /* progress: a pressed track with a violet glow */
  [role="progressbar"] { background: var(--neu-well) !important; border-radius: 999px; box-shadow: var(--neu-pressed); overflow: hidden; }
  [role="progressbar"] > * { background: var(--neu-violet) !important; box-shadow: 0 0 8px var(--neu-violet); border-radius: 999px; }

  /* status colours: one job each. The build compiles these to literal hex,
     so they are overridden here; colorOverrides cannot reach them. */
  [class*="text-success"], [class*="text-emerald-"], [class*="text-green-"] { color: var(--neu-mint) !important; }
  [class*="bg-success"], [class*="bg-emerald-"], [class*="bg-green-"] { background-color: color-mix(in srgb, var(--neu-mint) 14%, transparent) !important; }
  [class*="border-success"], [class*="border-emerald-"], [class*="border-green-"] { border-color: transparent !important; }
  [class*="text-warning"], [class*="text-amber-"], [class*="text-yellow-"] { color: var(--neu-amber) !important; }
  [class*="bg-warning"], [class*="bg-amber-"], [class*="bg-yellow-"] { background-color: color-mix(in srgb, var(--neu-amber) 14%, transparent) !important; }
  [class*="border-warning"], [class*="border-amber-"], [class*="border-yellow-"] { border-color: transparent !important; }
  [class*="text-destructive"], [class*="text-red-"] { color: var(--neu-red) !important; }
  [class*="bg-destructive/"], [class*="bg-red-"] { background-color: color-mix(in srgb, var(--neu-red) 10%, transparent) !important; }
  [class*="border-destructive"], [class*="border-red-"] { border-color: transparent !important; }
  button[class*="text-destructive"]:not(:hover), button[class*="text-red-"]:not(:hover) { color: var(--neu-fg3) !important; background: transparent !important; }
  /* small status badges become soft pills */
  main span[class*="font-compressed"][class*="border"] { border-radius: 999px !important; padding: 5px 11px !important; box-shadow: var(--neu-pressed); }

  /* ---- Chat ---------------------------------------------------------------- */
  /* The terminal sits in a pressed well. */
  /* User themes cannot set the terminal's own background (Hermes passes no
     terminalBackground for them), so the black canvas is blended into the well. */
  main div:has(> .hermes-chat-xterm-host) {
    background: var(--neu-well) !important; border-radius: 22px !important;
    box-shadow: var(--neu-pressed) !important; padding: 18px !important; isolation: isolate;
  }
  main .xterm, main .xterm .xterm-viewport, main .xterm .xterm-scrollable-element { background: transparent !important; }
  main .xterm .xterm-screen { filter: invert(1) hue-rotate(180deg); mix-blend-mode: darken; }

  /* The TUI's built-in boot palette, before its gateway hands over the skin. */
  [style*="rgb(255, 215, 0)"], [style*="#ffd700" i],
  [style*="rgb(255, 191, 0)"], [style*="#ffbf00" i] { color: var(--neu-violet) !important; }
  [style*="rgb(255, 248, 220)"], [style*="#fff8dc" i] { color: var(--neu-fg) !important; }
  [style*="rgb(218, 165, 32)"], [style*="#daa520" i],
  [style*="rgb(204, 155, 31)"], [style*="#cc9b1f" i],
  [style*="rgb(202, 158, 29)"], [style*="#ca9e1d" i],
  [style*="rgb(215, 168, 29)"], [style*="#d7a81d" i] { color: var(--neu-fg2) !important; }
  [style*="rgb(205, 127, 50)"], [style*="#cd7f32" i],
  [style*="rgb(184, 134, 11)"], [style*="#b8860b" i] { color: var(--neu-fg3) !important; }

  /* Phone top bar wordmark. */
  header button[aria-label="Open navigation"] + span { font-size: 0 !important; letter-spacing: 0; }
  header button[aria-label="Open navigation"] + span::after {
    content: "Hermes"; font-family: var(--theme-font-mono); font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--neu-fg);
  }
  header button[aria-label="Open navigation"] { border-radius: 50% !important; box-shadow: var(--neu-raised-sm) !important; }

  :focus-visible { outline: 2px solid var(--neu-violet); outline-offset: 2px; }
